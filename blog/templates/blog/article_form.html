<h1>Create Article</h1>

<form method="post">
    {% csrf_token %}
    {{ form.media }}
    {{ form.as_p }}

    <button type="submit" name="action" value="draft">
        Save Draft
    </button>

    <button type="submit" name="action" value="publish">
        Publish
    </button>

    <button type="submit" name="action" value="schedule">
        Schedule
    </button>
</form>
